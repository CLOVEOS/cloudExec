# CloudExec – production stack for a single cloud VM.
#
#   cp .env.example .env   # fill SARVAM_API_KEY, JWT_SECRET, ADMIN_EMAILS, DOMAIN
#   ./deploy/deploy.sh     # = docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (local dev):
#   - Only Caddy is reachable from the internet (80/443, automatic HTTPS).
#     Kafka, MongoDB, the API and workers live on the private Docker network.
#   - Required secrets fail fast if missing; containers always restart.
#   - Log rotation so a busy box doesn't fill its disk.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app-env: &app-env
  MONGO_URI: mongodb://mongodb:27017
  MONGO_DB: cloudexec
  USE_KAFKA: "true"
  KAFKA_BROKERS: kafka:29092
  KAFKA_PARTITIONS: "6"
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
  ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS in .env}
  SARVAM_API_KEY: ${SARVAM_API_KEY:-}
  SARVAM_CHAT_MODEL: ${SARVAM_CHAT_MODEL:-sarvam-105b}
  SARVAM_REASONING_EFFORT: ${SARVAM_REASONING_EFFORT:-low}
  SARVAM_MAX_TOKENS: ${SARVAM_MAX_TOKENS:-8192}
  RATE_LIMIT_COMPILE_PER_MIN: ${RATE_LIMIT_COMPILE_PER_MIN:-20}
  RATE_LIMIT_AI_PER_MIN: ${RATE_LIMIT_AI_PER_MIN:-5}
  SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
  NODE_ENV: production

services:
  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (your domain, or <ip-with-dashes>.sslip.io)}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env (for Let's Encrypt notices)}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    logging: *logging

  web:
    build: ./client
    restart: always
    depends_on: [api]
    logging: *logging

  api:
    build: ./server
    restart: always
    environment:
      <<: *app-env
      PORT: "8000"
    depends_on:
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    logging: *logging

  worker:
    build: ./server
    command: ["node", "worker.js"]
    restart: always
    user: root
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9100/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    logging: *logging

  kafka:
    image: apache/kafka:3.8.0
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
      interval: 10s
      retries: 10
    logging: *logging

  mongodb:
    image: mongo:7.0
    restart: always
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand("ping").ok'
      interval: 10s
      retries: 10
    logging: *logging

  spark-streaming:
    build: ./spark
    restart: always
    command: >
      spark-submit --master local[1] --driver-memory 1g
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      streaming_ingest.py --brokers kafka:29092 --lake /data/lake/executions
      --checkpoints /data/checkpoints --mongo-uri mongodb://mongodb:27017
    volumes:
      - lake_data:/data
      - ivy_cache:/opt/cloudexec/.ivy2
    depends_on:
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    logging: *logging

  spark-batch:
    build: ./spark
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          spark-submit --master local[2] --driver-memory 1g --packages org.mongodb.spark:mongo-spark-connector_2.12:10.4.0 \
            batch_insights.py --source lake --fallback-mongo \
            --path /data/lake/executions --mongo-uri mongodb://mongodb:27017 \
            || echo "batch run failed (lake may still be empty)";
          sleep $${INSIGHTS_INTERVAL_SECONDS:-3600};
        done
    volumes:
      - lake_data:/data
      - ivy_cache:/opt/cloudexec/.ivy2
    depends_on: [spark-streaming]
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  kafka_data:
  mongo_data:
  lake_data:
  ivy_cache:
