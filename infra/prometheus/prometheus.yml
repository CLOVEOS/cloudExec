global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cloudexec-api
    static_configs:
      - targets: ["api:8000"]

  # Every worker replica exposes :9100/metrics; DNS returns all replicas.
  - job_name: cloudexec-workers
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
