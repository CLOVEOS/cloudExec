# CloudExec – full stack on one machine.
#
#   cp .env.example .env            # add SARVAM_API_KEY + JWT_SECRET
#   docker compose up -d --build    # core: kafka, mongo, api, 2 workers, web, spark streaming + hourly batch
#   docker compose --profile observability up -d   # + Prometheus, Grafana, Kafka UI
#
# Open http://localhost:3000

x-app-env: &app-env
  MONGO_URI: mongodb://mongodb:27017
  MONGO_DB: cloudexec
  USE_KAFKA: "true"
  KAFKA_BROKERS: kafka:29092
  KAFKA_PARTITIONS: "6"
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  SARVAM_API_KEY: ${SARVAM_API_KEY:-}
  SARVAM_CHAT_MODEL: ${SARVAM_CHAT_MODEL:-sarvam-105b}
  NODE_ENV: production

services:
  # ── Messaging: single-node Kafka in KRaft mode (no ZooKeeper) ──
  kafka:
    image: apache/kafka:3.8.0
    container_name: cloudexec-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 10s
      retries: 10

  # ── Operational store ──
  mongodb:
    image: mongo:7.0
    container_name: cloudexec-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --quiet --eval 'db.runCommand("ping").ok'
      interval: 10s
      retries: 10

  # ── API gateway ──
  api:
    build: ./server
    environment:
      <<: *app-env
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    restart: unless-stopped

  # ── Execution workers (scale with: docker compose up -d --scale worker=4) ──
  worker:
    build: ./server
    command: ["node", "worker.js"]
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "3"
    volumes:
      # Workers launch sandbox containers on the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    # Workers serve /metrics on 9100 (no API on 8000), so check that instead.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9100/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 2
    depends_on:
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    restart: unless-stopped

  # ── Web UI (nginx serves the SPA and proxies /api) ──
  web:
    build: ./client
    ports:
      - "3000:80"
    depends_on: [api]
    restart: unless-stopped

  # ── Spark Structured Streaming: Kafka → Parquet lake + live metrics ──
  spark-streaming:
    build: ./spark
    command: >
      spark-submit
      --master local[2]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      streaming_ingest.py --brokers kafka:29092 --lake /data/lake/executions
      --checkpoints /data/checkpoints --mongo-uri mongodb://mongodb:27017
    volumes:
      - lake_data:/data
      - ivy_cache:/opt/cloudexec/.ivy2
    depends_on:
      kafka: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    restart: unless-stopped

  # ── Spark batch: recompute personalised insights every hour ──
  spark-batch:
    build: ./spark
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          spark-submit --master local[2] batch_insights.py --source lake \
            --path /data/lake/executions --mongo-uri mongodb://mongodb:27017 \
            || echo "batch run failed (lake may still be empty)";
          sleep $${INSIGHTS_INTERVAL_SECONDS:-3600};
        done
    environment:
      INSIGHTS_INTERVAL_SECONDS: "3600"
    volumes:
      - lake_data:/data
    depends_on: [spark-streaming]
    restart: unless-stopped

  # ── Observability (optional) ──
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [observability]
    environment:
      KAFKA_CLUSTERS_0_NAME: cloudexec
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8080:8080"

volumes:
  kafka_data:
  mongo_data:
  lake_data:
  ivy_cache:
